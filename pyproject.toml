requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.24.0",
    "datasets>=2.14.0",
    "huggingface_hub>=0.17.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "packaging>=23.0",
    "pandas>=2.0.0",
    "peft>=0.6.0",
    "psutil>=5.9.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "sentencepiece>=0.1.99",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "transformers>=4.35.0",
    "trl>=0.7.0",
    "wandb>=0.15.0",
]
