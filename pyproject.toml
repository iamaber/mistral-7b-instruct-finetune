[project]
name = "pubmedqa-loraplus"
version = "0.1.0"
description = "Single-purpose LoRA+ fine-tuning workspace for PubMedQA."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.24.0",
    "datasets>=2.14.0",
    "huggingface_hub>=0.17.0",
    "numpy>=1.24.0",
    "peft>=0.9.0",
    "sentencepiece>=0.1.99",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "transformers>=4.41.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402"]  # Allow late imports in scripts/ for sys.path manipulation

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "T201"]  # Allow late imports and print() in scripts
