name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify the lockfile matches pyproject.toml
        run: uv lock --check

      - name: Install the locked environment
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uvx ruff@0.15.20 check .

      - name: Test
        run: uv run --frozen --extra dev pytest -q
